version: '3.8'

services:
  postgres:
    image: kartoza/postgis:16-3.4
    container_name: fleettrack_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleettrack}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-fleetpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    networks:
      - fleet_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleettrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: fleettrack_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - fleet_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: fleettrack_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleetpass}@postgres:5432/${POSTGRES_DB:-fleettrack}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-a3f8e2c1d9b047a6f3e8c2d1b9a047f6e3c8d2b1a9047f6e3c8d2b1a9047f6e3}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      TRACKING_LINK_EXPIRE_HOURS: 24
      APP_ENVIRONMENT: production
      BASE_URL: https://${DOMAIN_NAME:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fleet_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: fleettrack_frontend
    restart: unless-stopped
    networks:
      - fleet_network

  nginx:
    image: nginx:1.25-alpine
    container_name: fleettrack_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - fleet_network

volumes:
  postgres_data:
  redis_data:
  letsencrypt_certs:

networks:
  fleet_network:
    driver: bridge
